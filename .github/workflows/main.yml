name: Stock News Bot

on:
  schedule:
    - cron: '0 8 * * *'  # 17:00 JST
  workflow_dispatch:
    inputs:
      job:
        description: 'collect / send / cleanup'
        required: true
        default: 'collect'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  collect:
    if: >
      github.event.schedule == '0 8 * * *' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'collect')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install gspread google-auth newsapi-python yfinance beautifulsoup4 requests feedparser
      - run: echo "$GOOGLE_CREDENTIALS" | base64 -d > credentials.json
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      - run: python collect_news.py
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
      - run: python collect_keywords.py
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
      - run: python collect_market.py
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}

  send:
    needs: [collect]
    if: >
      always() && (
        (github.event.schedule == '0 8 * * *' && needs.collect.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'send')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install gspread google-auth anthropic newsapi-python yfinance requests beautifulsoup4 feedparser
      - run: echo "$GOOGLE_CREDENTIALS" | base64 -d > credentials.json
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      - run: python send_digest.py
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

  cleanup:
    needs: [send]
    if: >
      always() && (
        (github.event.schedule == '0 8 * * *' && needs.send.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'cleanup')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install gspread google-auth
      - run: echo "$GOOGLE_CREDENTIALS" | base64 -d > credentials.json
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      - run: python cleanup.py
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
